name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install the pinned Caddy test binary
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz \
            --output caddy.tar.gz
          echo '8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9  caddy.tar.gz' | sha512sum --check --strict
          tar -xzf caddy.tar.gz caddy
      - name: Check scripts and gateway boundary
        env:
          CADDY_BINARY: ${{ runner.temp }}/caddy
        run: |
          python3 -m compileall -q scripts
          sh -n core/start.sh gateway/start.sh
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_deployment_scripts.py
          python3 scripts/check_gateway.py --caddy "$CADDY_BINARY"
