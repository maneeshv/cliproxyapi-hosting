<title id="title">CLIProxyAPI on Railway — public inference and private management</title>
<desc id="desc">API clients enter through Railway HTTPS ingress and gateway Caddy port 8080. Gateway sends an upstream API key over private HTTP port 8317 to core. Administrators reach admin Tailscale Forwarder over tailnet HTTPS port 8317; it forwards private HTTP to core. Core and admin each mount a separate persistent data volume. Provider APIs are outside Railway. Diagram reflects repository configuration, not live verification.</desc>
