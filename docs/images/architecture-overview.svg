<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1270" viewBox="0 0 2000 1270" role="img" aria-labelledby="title desc">
<title id="title">CLIProxyAPI on Railway: inference and private administration</title>
<desc id="desc">Repository-defined architecture. Clients enter through Railway HTTPS ingress to Caddy gateway port 8080, then private HTTP to CLIProxyAPI core port 8317. Administrators reach Tailscale Forwarder admin over tailnet HTTPS port 8317, then core over private HTTP. Core and admin have separate persistent volumes. Only admin joins the tailnet. Provider APIs are external. Live deployment exposure is not verified.</desc>
